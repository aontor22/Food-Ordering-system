<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4512c" />
  <title>Tomato — You’re offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbfaf7;color:#1f2522;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(520px,100%);padding:42px;border:1px solid #e9e6df;border-radius:28px;background:#fff;box-shadow:0 24px 70px rgba(39,35,28,.12);text-align:center}.logo{width:66px;height:66px;margin:0 auto 24px;display:grid;place-items:center;border-radius:20px;background:#f4512c;color:#fff;font-size:1.55rem;font-weight:800}.kicker{color:#d93d1d;font-size:.72rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:9px 0 12px;font-size:clamp(2rem,8vw,3rem);line-height:1;letter-spacing:-.05em}p{margin:0 auto 26px;max-width:390px;color:#69716d;line-height:1.65}.actions{display:grid;gap:10px}button,a{min-height:48px;border-radius:999px;border:0;font:inherit;font-weight:700;cursor:pointer}.primary{background:#f4512c;color:#fff}.secondary{display:grid;place-items:center;border:1px solid #e9e6df;background:#fff;color:#1f2522;text-decoration:none}@media(max-width:520px){.card{padding:34px 22px;border-radius:22px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">T.</div>
    <div class="kicker">Connection unavailable</div>
    <h1>You’re offline.</h1>
    <p>Tomato can keep parts of the app available offline, but placing orders, payments, account changes and live updates need an internet connection.</p>
    <div class="actions"><button class="primary" onclick="location.reload()">Try again</button><a class="secondary" href="/">Go to cached home</a></div>
  </main>
</body>
</html>
